[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scada-rag-lab1"
version = "1.0.0"
description = "Локальная исследовательская RAG-система по SCADA и рискам ANRE"
requires-python = ">=3.11,<3.13"

[project.scripts]
scada-rag = "scada_rag.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scada_rag = ["web/*.html", "web/*.css", "web/*.js"]
